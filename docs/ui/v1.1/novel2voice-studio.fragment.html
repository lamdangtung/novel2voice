<div id="nv-studio" aria-label="Novel2Voice studio">
<style>
#nv-studio{--nv-bg:light-dark(#f6f7f9,#11151b);--nv-panel:light-dark(#ffffff,#191f28);--nv-text:light-dark(#1d2939,#e9edf4);--nv-muted:light-dark(#687588,#a2adbd);--nv-line:light-dark(#e7ebf0,#303948);--nv-brand:light-dark(#475bd8,#a4b1ff);--nv-soft:light-dark(#eef1ff,#283151);--nv-green:light-dark(#16735a,#82d8ba);--nv-greenbg:light-dark(#eaf7f0,#203b32);--nv-orange:light-dark(#a25d12,#f0c584);--nv-orangebg:light-dark(#fff5e5,#423420);--nv-red:light-dark(#bb4545,#ffaaaa);--nv-redbg:light-dark(#fff0ee,#422a2a);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--nv-text);background:var(--nv-bg);border:1px solid var(--nv-line);border-radius:16px;overflow:hidden;position:relative;--nv-space:15px; color-scheme:light dark}
#nv-studio *{box-sizing:border-box}#nv-studio button,#nv-studio input,#nv-studio select,#nv-studio textarea{font:inherit}#nv-studio button{cursor:pointer}#nv-studio button:disabled{opacity:.45;cursor:default}#nv-studio button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--nv-panel);color:var(--nv-text);border:1px solid var(--nv-line);border-radius:8px;padding:8px 12px;font-weight:500}#nv-studio button:hover:not(:disabled){background:var(--nv-soft)}#nv-studio button.nv-primary{background:var(--nv-brand);color:light-dark(#fff,#172048);border-color:transparent}#nv-studio button.nv-link{padding:0;border:0;background:none;color:var(--nv-brand);text-align:left;justify-content:flex-start}#nv-studio .nv-icon{width:17px;height:17px;flex-shrink:0}#nv-studio svg{width:17px;height:17px}#nv-studio .nv-top{height:66px;background:var(--nv-panel);border-bottom:1px solid var(--nv-line);display:flex;align-items:center;gap:12px;padding:0 22px;padding-right:110px}#nv-studio .nv-logo{background:var(--nv-brand);color:light-dark(#fff,#172048);border-radius:9px;width:33px;height:33px;display:grid;place-items:center}#nv-studio .nv-wordmark{font-size:17px;letter-spacing:-.5px;font-weight:650}#nv-studio .nv-meta{color:var(--nv-muted);font-size:12px}#nv-studio .nv-pill{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:500;white-space:nowrap;background:var(--nv-bg);color:var(--nv-muted)}#nv-studio .nv-topend{margin-left:auto;display:flex;align-items:center;gap:12px}#nv-studio .nv-dot{width:6px;height:6px;border-radius:50%;background:var(--nv-green)}#nv-studio .nv-shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:690px}#nv-studio aside{background:var(--nv-panel);border-right:1px solid var(--nv-line);padding:22px 12px;display:flex;flex-direction:column;gap:5px}#nv-studio .nv-nav{border:0;background:transparent;justify-content:flex-start;padding:10px 12px;color:var(--nv-muted);font-size:13px}#nv-studio .nv-nav[aria-current=page]{background:var(--nv-soft);color:var(--nv-brand)}#nv-studio .nv-navlabel{font-size:10px;letter-spacing:1.5px;color:var(--nv-muted);margin:9px 12px 7px}#nv-studio .nv-sidebarbottom{margin-top:auto;padding:22px 10px 4px;font-size:11px;color:var(--nv-muted)}#nv-studio main{padding:26px;min-width:0}#nv-studio .nv-crumb{font-size:12px;color:var(--nv-muted);display:flex;gap:8px;align-items:center;margin-bottom:20px}#nv-studio h1{font-size:25px;line-height:1.25;letter-spacing:-.8px;margin:0 0 7px;font-weight:650}#nv-studio h2{font-size:16px;font-weight:600;margin:0 0 8px}#nv-studio h3{font-size:14px;font-weight:600;margin:0}#nv-studio p{margin:0}#nv-studio .nv-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}#nv-studio .nv-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#nv-studio .nv-sub{font-size:12px;color:var(--nv-muted)}#nv-studio .nv-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}#nv-studio .nv-stat{padding:15px;background:var(--nv-panel);border:1px solid var(--nv-line);border-radius:10px}#nv-studio .nv-stat strong{display:block;font-size:25px;font-weight:600;letter-spacing:-.5px;margin-top:5px}#nv-studio .nv-notice{background:var(--nv-soft);border-radius:8px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:12px;margin-bottom:20px;color:var(--nv-text)}#nv-studio .nv-tabs{display:flex;gap:24px;border-bottom:1px solid var(--nv-line);margin:0 0 20px}#nv-studio .nv-tabs button{border:0;border-radius:0;padding:0 0 11px;color:var(--nv-muted);background:none;font-size:13px}#nv-studio .nv-tabs button[aria-selected=true]{border-bottom:2px solid var(--nv-brand);color:var(--nv-brand)}#nv-studio .nv-panel{background:var(--nv-panel);border:1px solid var(--nv-line);border-radius:10px;overflow:hidden}#nv-studio .nv-toolbar{padding:14px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--nv-line)}#nv-studio input:not([type=checkbox]):not([type=range]),#nv-studio select,#nv-studio textarea{background:var(--nv-panel);color:var(--nv-text);border:1px solid var(--nv-line);border-radius:7px;padding:9px 11px;max-width:100%;min-width:0}#nv-studio input[type=checkbox]{accent-color:var(--nv-brand);width:15px;height:15px;vertical-align:middle}#nv-studio input[type=range]{accent-color:var(--nv-brand);width:100%}#nv-studio .nv-tablewrap{overflow-x:auto}#nv-studio table{width:100%;border-collapse:collapse;font-size:12px;text-align:left;white-space:nowrap}#nv-studio th{background:var(--nv-bg);font-size:11px;font-weight:500;color:var(--nv-muted)}#nv-studio th,#nv-studio td{padding:var(--nv-space) 12px;border-bottom:1px solid var(--nv-line)}#nv-studio tr:last-child td{border-bottom:0}#nv-studio .nv-celltitle{font-weight:500}#nv-studio .nv-status{font-size:11px;border-radius:5px;padding:4px 7px;display:inline-block}#nv-studio .nv-done{color:var(--nv-green);background:var(--nv-greenbg)}#nv-studio .nv-failed{color:var(--nv-red);background:var(--nv-redbg)}#nv-studio .nv-stale{color:var(--nv-orange);background:var(--nv-orangebg)}#nv-studio .nv-pending{color:var(--nv-muted);background:var(--nv-bg)}#nv-studio .nv-running{color:var(--nv-brand);background:var(--nv-soft)}#nv-studio .nv-tablefoot{padding:12px 14px;border-top:1px solid var(--nv-line);font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--nv-muted)}#nv-studio .nv-player{margin-top:16px;background:var(--nv-panel);border:1px solid var(--nv-line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}#nv-studio .nv-play{width:36px;height:36px;border-radius:50%;background:var(--nv-soft);color:var(--nv-brand)}#nv-studio .nv-track{height:5px;border-radius:5px;background:var(--nv-line);overflow:hidden;margin:9px 0}#nv-studio .nv-track span{display:block;height:100%;background:var(--nv-brand);border-radius:5px}#nv-studio .nv-bookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}#nv-studio .nv-book{background:var(--nv-panel);border:1px solid var(--nv-line);border-radius:11px;padding:20px}#nv-studio .nv-cover{width:48px;height:63px;background:var(--nv-soft);color:var(--nv-brand);border-radius:5px;display:grid;place-items:center;flex-shrink:0}#nv-studio .nv-formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px}#nv-studio label.nv-field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--nv-muted)}#nv-studio .nv-section{padding:20px}#nv-studio .nv-job{background:var(--nv-panel);border:1px solid var(--nv-line);border-radius:10px;padding:18px;margin-bottom:12px}#nv-studio .nv-jobhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}#nv-studio .nv-steps{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--nv-muted);margin-bottom:20px;flex-wrap:wrap}#nv-studio .nv-step{padding:5px 8px;border-radius:5px}#nv-studio .nv-step.active{background:var(--nv-soft);color:var(--nv-brand)}#nv-studio .nv-drop{padding:28px 14px;border:1px dashed var(--nv-brand);border-radius:10px;background:var(--nv-soft);text-align:center;display:grid;gap:10px;justify-items:center}#nv-studio .nv-overlay{position:absolute;inset:0;background:light-dark(#15243c55,#0008);z-index:5;padding:60px 20px;display:flex;align-items:flex-start;justify-content:center}#nv-studio .nv-modal{width:560px;max-width:100%;background:var(--nv-panel);border:1px solid var(--nv-line);border-radius:14px;box-shadow:0 20px 70px #0003;padding:24px}#nv-studio .nv-modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}#nv-studio .nv-modal label{margin-top:13px}#nv-studio .nv-choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--nv-line);border-radius:8px;margin:9px 0;font-size:12px}#nv-studio .nv-choice:has(input:checked){background:var(--nv-soft);border-color:var(--nv-brand)}#nv-studio .nv-textsample{white-space:pre-wrap;background:var(--nv-bg);padding:16px;border-radius:8px;font-family:Georgia,serif;line-height:1.9;font-size:14px}#nv-studio .nv-toast{margin:12px 0;padding:10px 12px;border-radius:7px;background:var(--nv-greenbg);color:var(--nv-green);font-size:12px}#nv-studio .nv-micro{font-size:11px;color:var(--nv-muted)}#nv-studio .nv-spacer{height:16px}#nv-studio .nv-selectedbar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--nv-soft);gap:10px;flex-wrap:wrap;font-size:12px}#nv-studio .nv-empty{padding:45px 20px;text-align:center;color:var(--nv-muted);white-space:normal}#nv-studio button:focus-visible,#nv-studio input:focus-visible,#nv-studio select:focus-visible{outline:2px solid var(--nv-brand);outline-offset:2px}
@media(max-width:760px){#nv-studio .nv-shell{grid-template-columns:1fr}#nv-studio aside{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--nv-line);padding:8px}#nv-studio .nv-navlabel,#nv-studio .nv-sidebarbottom{display:none}#nv-studio .nv-nav{font-size:12px;padding:9px}#nv-studio main{padding:18px}#nv-studio .nv-heading{flex-wrap:wrap}#nv-studio .nv-stats{grid-template-columns:repeat(2,1fr)}#nv-studio .nv-topend{display:none}#nv-studio .nv-bookgrid{grid-template-columns:1fr}#nv-studio .nv-tabs{gap:15px}#nv-studio .nv-formgrid{grid-template-columns:1fr}#nv-studio .nv-player{grid-template-columns:auto 1fr}#nv-studio .nv-player>span{grid-column:2}#nv-studio .nv-overlay{padding:20px 10px}#nv-studio h1{font-size:22px}#nv-studio .nv-modal{padding:18px}#nv-studio .nv-top{padding-left:16px}#nv-studio .nv-tabs button{font-size:12px}}
</style>
<header class="nv-top"><span class="nv-logo"><i data-lucide="audio-lines" aria-hidden="true"></i></span><span class="nv-wordmark">novel2voice</span><span class="nv-pill">STUDIO</span><div class="nv-topend"><span class="nv-dot"></span><span class="nv-meta">Local workspace</span></div></header>
<div class="nv-shell"><aside aria-label="Điều hướng"><div class="nv-navlabel">WORKSPACE</div><button class="nv-nav" data-page="overview"><i data-lucide="layout-dashboard" aria-hidden="true"></i>Tổng quan</button><button class="nv-nav" data-page="library" aria-current="page"><i data-lucide="library" aria-hidden="true"></i>Thư viện truyện</button><button class="nv-nav" data-page="jobs"><i data-lucide="list-todo" aria-hidden="true"></i>Công việc <span class="nv-pill" id="nv-jobcount">1</span></button><div class="nv-navlabel" style="margin-top:25px">THIẾT LẬP</div><button class="nv-nav" data-page="settings"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>Cấu hình</button><button class="nv-nav" data-page="health"><i data-lucide="activity" aria-hidden="true"></i>Môi trường</button><div class="nv-sidebarbottom"><div class="nv-row"><span class="nv-dot"></span> Máy cá nhân</div><div style="margin-top:8px">v1.1 · UI prototype<br>Dữ liệu & tác vụ mô phỏng</div></div></aside><main id="nv-main"></main></div><div id="nv-modalhost"></div><div id="nv-announcement" aria-live="polite" class="nv-micro" style="padding:0 20px 10px;text-align:right">Bản mock tương tác · Không xử lý file hoặc gọi API thật</div>
<script>
(()=>{
const root=document.getElementById('nv-studio'), main=root.querySelector('#nv-main'), modalhost=root.querySelector('#nv-modalhost');
const saved=window.openai?.widgetState; const initial=saved?.privateContent||{};
let state={page:initial.page||'story',tab:initial.tab||'chapters',book:Math.min(initial.book||0,1),filter:'all',query:'',selected:new Set(),playing:false,track:23,importStep:1,imported:false,jobStep:1,toast:'',provider:'vieneu',voice:'Thiện Minh',density:'Thoáng',jobStatus:'running',progress:64,newJobs:[],...{}};
const books=[{name:'Đế chế sắt và máu',desc:'Tiểu thuyết lịch sử · Tiếng Việt',total:196,done:180,other:9,errors:7},{name:'Hành trình phương Bắc',desc:'Phiêu lưu · Tiếng Anh → Tiếng Việt',total:32,done:24,other:8,errors:0}];
const titles=['Bình minh trên chiến tuyến','Bức thư từ phương Bắc','Cuộc gặp tại Berlin','Những lời chưa nói','Lệnh điều động','Trước giờ xuất phát','Người khách trong đêm','Con đường phía trước'];
let chapters=titles.map((t,i)=>({id:219+i,title:t,status:['done','done','running','pending','failed','stale','done','pending'][i],duration:['18:42','21:08','—','—','—','19:35','17:24','—'][i],origin:i===1?'MP3 nhập trước':'VieNeu · Thiện Minh'}));
const chapterSets=[chapters,chapters.map(c=>({...c,id:c.id,title:c.title,status:c.status==='failed'?'pending':c.status,origin:'Edge-TTS · Hoài My'}))];chapters=chapterSets[state.book]||chapterSets[0];
const statusText={done:'Có audio',running:'Đang tạo',pending:'Chưa có audio',failed:'Tạo audio lỗi',stale:'Cần cập nhật'};
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const badge=s=>`<span class="nv-status nv-${s}">${statusText[s]||s}</span>`;
const btn=(label,action,primary=false)=>`<button data-action="${action}" class="${primary?'nv-primary':''}">${label}</button>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:state.page,book:books[state.book].name,tab:state.tab,selectedChapters:[...state.selected],provider:state.provider},privateContent:{page:state.page,tab:state.tab,book:state.book}})?.catch(()=>{});}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function navigate(page){state.page=page;state.toast='';state.selected.clear();render();persist();}
function heading(title,sub,actions=''){return `<div class="nv-heading"><div><h1>${title}</h1><p class="nv-sub">${sub}</p></div><div class="nv-row">${actions}</div></div>`;}
function stats(){const b=books[state.book];return `<div class="nv-stats">${[['Tổng số chương',b.total],['Có audio',b.done],['Chưa có audio',b.other],['Cần xử lý',b.errors]].map(([l,n])=>`<div class="nv-stat"><span class="nv-sub">${l}</span><strong>${n}</strong></div>`).join('')}</div>`;}
function story(){const b=books[state.book];return `<div class="nv-crumb"><button class="nv-link" data-page="library">Thư viện truyện</button> / <span>${b.name}</span></div>${heading(b.name,b.desc,btn(icon('upload')+' Import','import')+btn(icon('plus')+' Tạo tác vụ','newjob',true))}<div class="nv-row nv-sub"><span class="nv-pill">${state.provider==='vieneu'?'VieNeu':state.provider} · ${esc(state.voice)}</span><span>Cập nhật hôm nay, 14:32</span></div>${stats()}<div class="nv-tabs" role="tablist" aria-label="Bộ truyện">${[['chapters','Chương truyện'],['bookjobs','Công việc'],['booksettings','Cấu hình truyện']].map(([id,l])=>`<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${l}</button>`).join('')}</div>${state.tab==='chapters'?chapterTable():state.tab==='bookjobs'?jobs():settings(true)}`;}
function chapterTable(){let rows=chapters.filter(c=>(state.filter==='all'||c.status===state.filter)&&(`${c.id} ${c.title}`.toLowerCase().includes(state.query.toLowerCase())));return `${state.jobStatus==='running'&&state.book===0?`<div class="nv-notice">${icon('audio-lines')}<div style="flex:1"><strong>Đang tạo audio · Chương 221</strong><div class="nv-sub">7/11 đoạn hoàn thành · Tiến độ mô phỏng</div></div><button class="nv-link" data-page="jobs">Xem tác vụ →</button></div>`:''}<div class="nv-panel"><div class="nv-toolbar"><input id="nv-search" aria-label="Tìm chương" placeholder="Tìm số chương, tiêu đề…" value="${esc(state.query)}"><select id="nv-filter" aria-label="Lọc trạng thái">${[['all','Tất cả trạng thái'],...Object.entries(statusText)].map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select></div>${state.selected.size?`<div class="nv-selectedbar"><span>Đã chọn <strong>${state.selected.size}</strong> chương</span><div class="nv-row">${btn('Tạo audio','selectedtts',true)}${btn('Ghép audio','combine')}${btn('Bỏ chọn','clear')}</div></div>`:''}<div class="nv-tablewrap"><table><thead><tr><th><input type="checkbox" aria-label="Chọn tất cả chương đang hiển thị" id="nv-all" ${rows.length&&rows.every(c=>state.selected.has(c.id))?'checked':''}></th><th>Chương / Nội dung</th><th>Trạng thái audio</th><th>Thời lượng</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><input type="checkbox" data-chapter="${c.id}" aria-label="Chọn chương ${c.id}" ${state.selected.has(c.id)?'checked':''}></td><td><button class="nv-link nv-celltitle" data-detail="${c.id}">Chương ${c.id} · ${c.title}</button><div class="nv-micro">${c.origin==='MP3 nhập trước'?'Nhập từ audio cũ · Đã xác nhận':'TXT tiếng Việt'}</div></td><td>${badge(c.status)}</td><td style="font-variant-numeric:tabular-nums">${c.duration}</td><td>${['done','stale'].includes(c.status)?`<button data-play="${c.id}" aria-label="Nghe thử chương ${c.id}">${icon('play')}</button>`:`<button class="nv-link" data-detail="${c.id}">${c.status==='failed'?'Xem lỗi':'Chi tiết'}</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="nv-empty">Không có chương phù hợp. Thử thay đổi bộ lọc.</td></tr>'}</tbody></table></div><div class="nv-tablefoot"><span>${rows.length} chương mẫu / ${bTotal()} chương</span><span>Dữ liệu minh họa UI</span></div></div>${chapters.some(c=>['done','stale'].includes(c.status))?player():''}`;}
function bTotal(){return books[state.book].total;}
function player(){return `<div class="nv-player"><button class="nv-play" data-action="playtoggle" aria-label="${state.playing?'Tạm dừng':'Phát mô phỏng'}">${icon(state.playing?'pause':'play')}</button><div><div class="nv-row" style="justify-content:space-between"><span style="font-size:12px;font-weight:500">Chương ${state.audioChapter||219} · ${titles[(state.audioChapter||219)-219]||titles[0]}</span><span class="nv-micro">Nghe thử mô phỏng</span></div><input type="range" id="nv-seek" min="0" max="100" value="${state.track}" aria-label="Tua audio mô phỏng"><div class="nv-row nv-micro" style="justify-content:space-between"><span>${Math.floor(state.track*11.22/60).toString().padStart(2,'0')}:${Math.floor(state.track*11.22%60).toString().padStart(2,'0')}</span><span>18:42</span></div></div><span class="nv-pill">1×</span></div>`;}
function library(){return heading('Thư viện truyện','Nội dung, giọng đọc và tiến độ — trong một workspace.',btn(icon('plus')+' Thêm truyện','addbook',true))+`<div class="nv-bookgrid">${books.map((b,i)=>`<div class="nv-book"><div class="nv-row" style="align-items:flex-start"><div class="nv-cover">${icon('book-open')}</div><div style="flex:1;min-width:0"><h2>${esc(b.name)}</h2><p class="nv-sub">${b.desc}</p><div class="nv-spacer"></div><span class="nv-pill">${i?'Edge-TTS · Hoài My':'VieNeu · Thiện Minh'}</span></div></div><div class="nv-spacer"></div><div class="nv-row nv-sub" style="justify-content:space-between"><span>${b.done}/${b.total} chương có audio</span><span>${Math.round(b.done/b.total*100)}%</span></div><div class="nv-track"><span style="width:${b.done/b.total*100}%"></span></div><div class="nv-row" style="justify-content:space-between;margin-top:18px"><span class="nv-micro">${b.errors?b.errors+' chương cần xử lý':'Chưa có lỗi'}</span><button data-book="${i}">Mở truyện ${icon('arrow-right')}</button></div></div>`).join('')}</div>`;}
function overview(){return heading('Chào buổi chiều 👋','Tiếp tục câu chuyện của bạn.',btn('Mở thư viện','library',true))+`<div class="nv-stats">${[['Bộ truyện',books.length],['Chương đã nhập',books.reduce((a,b)=>a+b.total,0)],['Chương có audio',books.reduce((a,b)=>a+b.done,0)],['Job đang chạy',state.jobStatus==='running'?1:0]].map(([l,n])=>`<div class="nv-stat"><span class="nv-sub">${l}</span><strong>${n}</strong></div>`).join('')}</div><h2 style="margin:25px 0 14px">Công việc gần đây</h2>${jobs()}<h2 style="margin:25px 0 14px">Tiếp tục làm việc</h2><div class="nv-job nv-row" style="justify-content:space-between"><div><h3>Đế chế sắt và máu</h3><p class="nv-sub">180/196 chương có audio · 7 chương cần xử lý</p></div>${btn('Mở bộ truyện →','story')}</div>`;}
function jobs(){return `<div class="nv-job"><div class="nv-jobhead"><div><h3>Tạo audio · Đế chế sắt và máu</h3><span class="nv-sub">Chương 219–226 · VieNeu / Thiện Minh</span></div><span class="nv-status ${state.jobStatus==='running'?'nv-running':state.jobStatus==='completed'?'nv-done':'nv-stale'}">${{running:'Đang chạy',stopped:'Đã dừng',completed:'Hoàn thành'}[state.jobStatus]}</span></div><div class="nv-row nv-sub" style="justify-content:space-between"><span>${state.jobStatus==='completed'?'11/11 đoạn hoàn thành':'Chương 221 · 7/11 đoạn hoàn thành'}</span><span>${state.progress}%</span></div><div class="nv-track"><span style="width:${state.progress}%"></span></div><div class="nv-row" style="justify-content:space-between;margin-top:14px"><span class="nv-micro">Checkpoint đã lưu · Tiến độ mô phỏng</span><div class="nv-row">${state.jobStatus==='running'?btn('Dừng an toàn','stop'):state.jobStatus==='stopped'?btn('Tiếp tục','resume',true):''}${state.jobStatus!=='completed'?btn('Mô phỏng hoàn tất','finish'):''}</div></div></div>${state.newJobs.map((j,i)=>`<div class="nv-job"><div class="nv-jobhead"><div><h3>${esc(j)}</h3><p class="nv-sub">${esc(books[state.book].name)} · Dữ liệu mẫu</p></div><span class="nv-status nv-pending">Đang chờ</span></div><p class="nv-micro">Tác vụ mô phỏng đã được thêm vào hàng đợi.</p></div>`).join('')}<div class="nv-job"><div class="nv-jobhead"><div><h3>Tạo audio · Chương 223</h3><p class="nv-sub">Hôm nay, 13:48 · Đã thử 3 lần</p></div><span class="nv-status nv-failed">Thất bại</span></div><p class="nv-sub">Không nhận được audio hợp lệ. Các đoạn hoàn thành đã được giữ.</p><div style="margin-top:12px">${btn('Thử lại đoạn lỗi','retry')}</div></div>`;}
function settings(perBook=false){return `${perBook?'':heading('Cấu hình','Thiết lập mặc định cho workspace và các nhà cung cấp.')}<div class="nv-panel nv-section"><h2>${perBook?'Cấu hình bộ truyện':'Giọng đọc và xử lý'}</h2><p class="nv-sub" style="margin-bottom:20px">${perBook?'Chỉ áp dụng cho tác vụ mới của truyện này.':'Mỗi bộ truyện có thể dùng cấu hình riêng.'}</p><div class="nv-formgrid"><label class="nv-field">Nhà cung cấp<select id="nv-provider">${['vieneu','edge-tts','openai','piper'].map(p=>`<option ${p===state.provider?'selected':''}>${p}</option>`).join('')}</select></label><label class="nv-field">Giọng đọc<select id="nv-voice">${(state.provider==='vieneu'?['Thiện Minh','Giọng mặc định']:state.provider==='edge-tts'?['vi-VN-HoaiMyNeural','vi-VN-NamMinhNeural']:state.provider==='openai'?['alloy','nova']:['Giọng từ model Piper']).map(v=>`<option ${state.voice===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="nv-field">Ký tự tối đa / đoạn<input type="number" min="100" value="2500"></label><label class="nv-field">Số đoạn / batch<input type="number" min="1" max="8" value="3"></label><label class="nv-field">Số lần thử lại<input type="number" min="0" value="2"></label><label class="nv-field">Model dịch<input value="gpt-4o-mini"></label></div><label class="nv-row nv-sub" style="margin-top:18px"><input type="checkbox" checked> Giữ các đoạn trung gian để tái sử dụng khi chỉnh nội dung</label><div class="nv-spacer"></div><div class="nv-row">${btn(icon('volume-2')+' Thử giọng','tryvoice')}${btn('Lưu cấu hình','saveconfig',true)}</div></div><div class="nv-panel nv-section" style="margin-top:16px"><h2>Glossary & kết nối</h2><div class="nv-row" style="justify-content:space-between;margin:14px 0"><span class="nv-sub">glossary.csv · Từ điển tên riêng / thuật ngữ</span>${btn('Thay glossary','glossary')}</div><div class="nv-row" style="justify-content:space-between"><span class="nv-sub">OpenAI API key</span><span class="nv-status nv-done">Đã cấu hình · ••••</span></div></div>`;}
function health(){return heading('Môi trường','Kiểm tra dependency và cấu hình trước khi bắt đầu.',btn(icon('refresh-cw')+' Kiểm tra lại','doctor',true))+`<div class="nv-notice">${icon('info')}<span>Kiểm tra không nạp model và không gọi mạng. Thử giọng thật là thao tác riêng.</span></div><div class="nv-panel"><table><thead><tr><th>Thành phần</th><th>Trạng thái mẫu</th><th>Chi tiết</th></tr></thead><tbody>${[['FFmpeg / ffprobe','done','Đã sẵn sàng'],['VieNeu 3.8.3','done','Đã cài · Chưa thử nạp model'],['Edge-TTS','done','Đã cài · Cần Internet'],['OpenAI','done','Đã cấu hình key'],['Piper','failed','Thiếu thư viện piper-tts']].map(([n,s,t])=>`<tr><td>${n}</td><td><span class="nv-status nv-${s}">${s==='done'?'Sẵn sàng':'Cần bổ sung'}</span></td><td>${t}</td></tr>`).join('')}</tbody></table></div><p class="nv-micro" style="margin-top:12px">Kết quả minh họa UI, không phải kiểm tra trực tiếp máy của bạn.</p>`;}
function render(){root.querySelectorAll('.nv-nav').forEach(n=>n.setAttribute('aria-current',n.dataset.page===(state.page==='story'?'library':state.page)?'page':'false'));root.querySelector('#nv-jobcount').textContent=(state.jobStatus==='running'?1:0)+state.newJobs.length;main.innerHTML=({story,library,overview,settings:()=>settings(false),jobs:()=>heading('Công việc','Tác vụ chạy nền và kết quả xử lý.',btn(icon('plus')+' Tạo tác vụ','newjob',true))+jobs(),health}[state.page]||story)();if(state.toast)main.insertAdjacentHTML('afterbegin',`<div class="nv-toast" role="status">${esc(state.toast)}</div>`);icons();}
function toast(message){state.toast=message;render();}
function openModal(title,body,footer){modalhost.innerHTML=`<div class="nv-overlay"><section class="nv-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="nv-jobhead"><h2>${title}</h2><button data-action="close" aria-label="Đóng">${icon('x')}</button></div>${body}<div class="nv-modalfoot">${footer}</div></section></div>`;icons();const focusable=modalhost.querySelector('input,select,button');focusable?.focus();}
function close(){modalhost.innerHTML='';}
function importModal(){if(state.importStep===1)openModal('Import vào bộ truyện',`<div class="nv-steps"><span class="nv-step active">1 · Chọn nguồn</span>→<span>2 · Kiểm tra</span>→<span>3 · Hoàn tất</span></div><div class="nv-drop">${icon('folder-open')}<h3>Thêm chương vào ${esc(books[state.book].name)}</h3><p class="nv-sub">TXT tiếng Việt, bản gốc hoặc MP3 đã có</p>${btn('Chọn dữ liệu mẫu','importpreview',true)}</div><p class="nv-micro" style="margin-top:12px">Mock dùng bộ file mẫu để bạn kiểm tra luồng import.</p><label class="nv-row nv-sub"><input type="checkbox" checked> Bao gồm các thư mục con</label>`,btn('Hủy','close'));else openModal('Kiểm tra trước khi import',`<div class="nv-steps"><span>1 · Chọn nguồn</span>→<span class="nv-step active">2 · Kiểm tra</span>→<span>3 · Hoàn tất</span></div><div class="nv-notice">${icon('info')}<span>3 TXT mới, 1 audio đã ghép chương. Một chương trùng sẽ được bỏ qua.</span></div><div class="nv-tablewrap"><table><thead><tr><th>File mẫu</th><th>Ánh xạ</th><th>Xử lý</th></tr></thead><tbody><tr><td>227_vi.txt</td><td>Chương 227</td><td>Thêm mới</td></tr><tr><td>228_vi.txt</td><td>Chương 228</td><td>Thêm mới</td></tr><tr><td>229_vi.txt</td><td>Chương 229</td><td>Thêm mới</td></tr><tr><td>219_vi.txt</td><td>Đã tồn tại</td><td>Bỏ qua</td></tr><tr><td>227.mp3</td><td><select aria-label="Ánh xạ audio"><option>Chương 227</option><option>Chương 228</option></select></td><td>Audio nhập trước</td></tr></tbody></table></div><label class="nv-row nv-sub"><input type="checkbox" id="nv-confirmmapping" checked> Tôi xác nhận ánh xạ audio với chương.</label><p class="nv-micro">Nhập MP3 không xác nhận audio đọc đúng từng từ của TXT.</p>`,btn('Quay lại','importback')+btn('Xác nhận import','importconfirm',true));}
function jobModal(){const selection=state.selected.size?`${state.selected.size} chương đã chọn`:'8 chương mẫu đang hiển thị';if(state.jobStep===1)openModal('Tạo tác vụ',`<div class="nv-steps"><span class="nv-step active">1 · Thiết lập</span>→<span>2 · Xem trước</span></div><label class="nv-field">Thao tác<select id="nv-jobtype"><option ${state.jobType==='Tạo audio'?'selected':''}>Tạo audio</option><option>Chỉ dịch EN → VI</option><option>Dịch rồi tạo audio</option><option ${state.jobType==='Ghép audio'?'selected':''}>Ghép audio</option></select></label><label class="nv-field">Phạm vi<select id="nv-jobscope"><option>${selection}</option><option>Các chương chưa có audio</option><option>Các chương bị lỗi</option><option>Các chương cần cập nhật</option></select></label><div class="nv-spacer"></div><p class="nv-sub">Cấu hình truyện: ${esc(state.provider)} · ${esc(state.voice)} · batch 3 đoạn</p><label class="nv-row nv-sub"><input type="checkbox" checked> Tái sử dụng kết quả hợp lệ</label><label class="nv-row nv-sub"><input type="checkbox" checked> Giữ audio cũ đã xác nhận</label><label class="nv-row nv-sub"><input type="checkbox" checked> Tiếp tục chương khác khi có lỗi</label>`,btn('Hủy','close')+btn('Xem trước tác vụ →','jobpreview',true));else {const combine=state.jobType==='Ghép audio';openModal('Xem trước tác vụ',`<div class="nv-steps"><span>1 · Thiết lập</span>→<span class="nv-step active">2 · Xem trước</span></div><h3>${esc(state.jobType)} · ${esc(books[state.book].name)}</h3><p class="nv-sub" style="margin:8px 0 16px">${esc(state.jobScope||selection)}</p><div class="nv-panel nv-section"><div class="nv-row" style="justify-content:space-between"><span>Sẵn sàng ${combine?'ghép':'xử lý'}</span><strong>${combine?'3 audio hợp lệ':'5 chương'}</strong></div><div class="nv-row nv-sub" style="justify-content:space-between;margin-top:12px"><span>${combine?'Thứ tự chương':'Tái sử dụng / bỏ qua'}</span><span>${combine?'219 → 220 → 225':'3 chương'}</span></div></div><div class="nv-spacer"></div><div class="nv-notice">${icon('info')}<span>${combine?'Chỉ audio hợp lệ được ghép. Giữ nguyên MP3 riêng từng chương.':'Bản mock mô phỏng queue. Khi triển khai thật, dịch có thể gọi API tính phí; TTS có thể nạp model hoặc dùng mạng.'}</span></div>`,btn('Quay lại','jobback')+btn('Bắt đầu mô phỏng','jobstart',true));}}
root.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.page){navigate(t.dataset.page);return;}if(t.dataset.book){state.book=Number(t.dataset.book);chapters=chapterSets[state.book]||[];state.tab='chapters';navigate('story');return;}if(t.dataset.tab){state.tab=t.dataset.tab;render();persist();return;}if(t.dataset.detail){const c=chapters.find(c=>c.id===Number(t.dataset.detail));openModal(`Chương ${c.id} · ${c.title}`,`${badge(c.status)}<div class="nv-spacer"></div>${c.status==='failed'?'<div class="nv-notice">Lỗi nhận audio từ provider. Các đoạn hoàn thành đã được giữ để thử lại.</div>':''}<p class="nv-sub">Nội dung mẫu · TXT tiếng Việt</p><div class="nv-spacer"></div><div class="nv-textsample">Mặt trời vừa nhô lên sau những mái nhà. Trên bàn, bức thư vẫn còn nguyên dấu niêm phong.\n\n“Chúng ta phải lên đường trước khi trời tối,” anh nói, nhìn về phía con đường vắng.</div><div class="nv-spacer"></div><p class="nv-micro">${c.origin==='MP3 nhập trước'?'Audio nhập từ trước · Người dùng đã xác nhận ánh xạ. Chưa xác minh nội dung.':'Giọng Thiện Minh · Bản mẫu cho kiểm tra bố cục.'}</p>`,btn('Đóng','close')+btn(c.status==='failed'?'Thử lại':'Tạo audio','detailtts',true));return;}if(t.dataset.play){state.audioChapter=Number(t.dataset.play);state.playing=true;render();return;}const a=t.dataset.action;if(!a)return;
switch(a){case'close':close();break;case'library':navigate('library');break;case'story':navigate('story');break;case'clear':state.selected.clear();render();break;case'import':state.importStep=1;importModal();break;case'importpreview':state.importStep=2;importModal();break;case'importback':state.importStep=1;importModal();break;case'importconfirm':if(!root.querySelector('#nv-confirmmapping').checked){root.querySelector('#nv-confirmmapping').focus();return;}if(!books[state.book].imported){books[state.book].total+=3;chapters.push(...[227,228,229].map((id,i)=>({id,title:['Một khởi đầu mới','Trạm dừng cuối','Bên kia đường chân trời'][i],status:i?'pending':'done',duration:i?'—':'20:12',origin:i?'TXT mới':'MP3 nhập trước'})));books[state.book].imported=true;}close();state.tab='chapters';state.page='story';toast('Đã import dữ liệu mẫu: 3 chương mới và 1 audio. Không thay đổi file thật.');break;case'newjob':case'selectedtts':case'detailtts':case'combine':state.jobStep=1;state.jobType=a==='combine'?'Ghép audio':'Tạo audio';jobModal();break;case'jobpreview':state.jobType=root.querySelector('#nv-jobtype').value;state.jobScope=root.querySelector('#nv-jobscope').value;state.jobStep=2;jobModal();break;case'jobback':state.jobStep=1;jobModal();break;case'jobstart':state.newJobs.unshift(state.jobType);close();navigate('jobs');toast('Đã thêm tác vụ mô phỏng vào hàng đợi.');break;case'stop':state.jobStatus='stopped';toast('Đã dừng mô phỏng. Checkpoint được giữ để tiếp tục.');break;case'resume':state.jobStatus='running';toast('Đã tiếp tục tác vụ mô phỏng từ checkpoint.');break;case'finish':state.jobStatus='completed';state.progress=100;const finished=chapters.find(c=>c.id===221);if(finished){finished.status='done';finished.duration='20:05';}toast('Mô phỏng hoàn tất. Audio chương 221 đã sẵn sàng.');break;case'retry':state.newJobs.unshift('Thử lại đoạn lỗi · Chương 223');toast('Đã tạo tác vụ thử lại mô phỏng.');break;case'playtoggle':state.playing=!state.playing;render();break;case'saveconfig':state.voice=root.querySelector('#nv-voice').value;toast('Đã lưu cấu hình trong bản mock. Chỉ áp dụng cho tác vụ mới.');persist();break;case'doctor':toast('Kiểm tra mô phỏng hoàn tất: Piper cần bổ sung thư viện.');break;case'tryvoice':openModal('Thử giọng',`<p class="nv-sub">${esc(state.provider)} · ${esc(state.voice)}</p><label class="nv-field">Nội dung thử<textarea rows="3">Xin chào. Chào mừng bạn đến với câu chuyện hôm nay.</textarea></label><p class="nv-micro" style="margin-top:14px">Trong bản thật, thao tác này có thể nạp model hoặc gọi dịch vụ. Bản mock không phát giọng thật.</p>`,btn('Đóng','close')+btn('Mô phỏng tạo bản nghe','voicepreview',true));break;case'voicepreview':close();toast('Bản nghe mô phỏng đã sẵn sàng. Giọng thật sẽ được kết nối ở bước API.');break;case'glossary':openModal('Glossary của truyện','<p class="nv-sub">Danh sách thuật ngữ mẫu</p><div class="nv-spacer"></div><div class="nv-tablewrap"><table><thead><tr><th>Từ gốc</th><th>Bản dịch</th></tr></thead><tbody><tr><td>Kaiser</td><td>Hoàng đế</td></tr><tr><td>Reich</td><td>Đế chế</td></tr><tr><td>Major von Humboldt</td><td>Thiếu tá von Humboldt</td></tr></tbody></table></div>',btn('Đóng','close'));break;case'addbook':openModal('Thêm bộ truyện','<label class="nv-field">Tên bộ truyện<input id="nv-bookname" placeholder="Nhập tên truyện…" required maxlength="80"></label><label class="nv-field">Ngôn ngữ nội dung<select id="nv-booklang"><option>Tiếng Việt</option><option>Tiếng Anh → Tiếng Việt</option></select></label>',btn('Hủy','close')+btn('Tạo bộ truyện','createbook',true));break;case'createbook':{const field=root.querySelector('#nv-bookname'),name=field.value.trim();if(!name){field.setCustomValidity('Vui lòng nhập tên bộ truyện.');field.reportValidity();return;}chapterSets.push([]);books.push({name,desc:root.querySelector('#nv-booklang').value,total:0,done:0,other:0,errors:0});close();navigate('library');toast('Đã thêm bộ truyện mẫu: '+name);break;}}
persist();});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.chapter){const id=Number(t.dataset.chapter);t.checked?state.selected.add(id):state.selected.delete(id);render();persist();}if(t.id==='nv-all'){chapters.filter(c=>(state.filter==='all'||c.status===state.filter)&&(`${c.id} ${c.title}`.toLowerCase().includes(state.query.toLowerCase()))).forEach(c=>t.checked?state.selected.add(c.id):state.selected.delete(c.id));render();persist();}if(t.id==='nv-filter'){state.filter=t.value;render();}if(t.id==='nv-provider'){state.provider=t.value;state.voice=state.provider==='vieneu'?'Thiện Minh':state.provider==='edge-tts'?'vi-VN-HoaiMyNeural':state.provider==='openai'?'alloy':'Giọng từ model Piper';render();}if(t.id==='nv-voice')state.voice=t.value;});
root.addEventListener('input',e=>{if(e.target.id==='nv-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();const input=root.querySelector('#nv-search');input.focus();input.setSelectionRange(pos,pos);}if(e.target.id==='nv-seek'){state.track=Number(e.target.value);}});
root.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&modalhost.children.length){const els=[...modalhost.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(p){state.page=p.page||state.page;state.tab=p.tab||state.tab;state.book=Math.min(p.book||0,books.length-1);chapters=chapterSets[state.book]||[];render();}});
render();if(globalThis.Tweak){const design={density:'Thoáng',radius:16};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--nv-space',design.density==='Gọn'?'10px':'15px');root.style.borderRadius=design.radius+'px';}});tweak.addSelect(design,'density',{label:'Mật độ bảng',options:['Thoáng','Gọn']});tweak.addSlider(design,'radius',{label:'Bo góc cửa sổ',min:0,max:20,step:2,unit:'px'});}
})();
</script>
</div>
