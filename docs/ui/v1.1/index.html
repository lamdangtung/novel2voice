&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;

      {

        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);

        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

    }

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

      });

&lt;div class=&quot;nv-shell&quot;&gt;&lt;aside aria-label=&quot;Điều hướng&quot;&gt;&lt;div class=&quot;nv-navlabel&quot;&gt;WORKSPACE&lt;/div&gt;&lt;button class=&quot;nv-nav&quot; data-page=&quot;overview&quot;&gt;&lt;i data-lucide=&quot;layout-dashboard&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Tổng quan&lt;/button&gt;&lt;button class=&quot;nv-nav&quot; data-page=&quot;library&quot; aria-current=&quot;page&quot;&gt;&lt;i data-lucide=&quot;library&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Thư viện truyện&lt;/button&gt;&lt;button class=&quot;nv-nav&quot; data-page=&quot;jobs&quot;&gt;&lt;i data-lucide=&quot;list-todo&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Công việc &lt;span class=&quot;nv-pill&quot; id=&quot;nv-jobcount&quot;&gt;1&lt;/span&gt;&lt;/button&gt;&lt;div class=&quot;nv-navlabel&quot; style=&quot;margin-top:25px&quot;&gt;THIẾT LẬP&lt;/div&gt;&lt;button class=&quot;nv-nav&quot; data-page=&quot;settings&quot;&gt;&lt;i data-lucide=&quot;sliders-horizontal&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Cấu hình&lt;/button&gt;&lt;button class=&quot;nv-nav&quot; data-page=&quot;health&quot;&gt;&lt;i data-lucide=&quot;activity&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Môi trường&lt;/button&gt;&lt;div class=&quot;nv-sidebarbottom&quot;&gt;&lt;div class=&quot;nv-row&quot;&gt;&lt;span class=&quot;nv-dot&quot;&gt;&lt;/span&gt; Máy cá nhân&lt;/div&gt;&lt;div style=&quot;margin-top:8px&quot;&gt;v1.1 · UI prototype&lt;br&gt;Dữ liệu &amp; tác vụ mô phỏng&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;main id=&quot;nv-main&quot;&gt;&lt;/main&gt;&lt;/div&gt;&lt;div id=&quot;nv-modalhost&quot;&gt;&lt;/div&gt;&lt;div id=&quot;nv-announcement&quot; aria-live=&quot;polite&quot; class=&quot;nv-micro&quot; style=&quot;padding:0 20px 10px;text-align:right&quot;&gt;Bản mock tương tác · Không xử lý file hoặc gọi API thật&lt;/div&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;nv-studio&#x27;), main=root.querySelector(&#x27;#nv-main&#x27;), modalhost=root.querySelector(&#x27;#nv-modalhost&#x27;);
const saved=window.openai?.widgetState; const initial=saved?.privateContent||{};
let state={page:initial.page||&#x27;story&#x27;,tab:initial.tab||&#x27;chapters&#x27;,book:Math.min(initial.book||0,1),filter:&#x27;all&#x27;,query:&#x27;&#x27;,selected:new Set(),playing:false,track:23,importStep:1,imported:false,jobStep:1,toast:&#x27;&#x27;,provider:&#x27;vieneu&#x27;,voice:&#x27;Thiện Minh&#x27;,density:&#x27;Thoáng&#x27;,jobStatus:&#x27;running&#x27;,progress:64,newJobs:[],...{}};
const books=[{name:&#x27;Đế chế sắt và máu&#x27;,desc:&#x27;Tiểu thuyết lịch sử · Tiếng Việt&#x27;,total:196,done:180,other:9,errors:7},{name:&#x27;Hành trình phương Bắc&#x27;,desc:&#x27;Phiêu lưu · Tiếng Anh → Tiếng Việt&#x27;,total:32,done:24,other:8,errors:0}];
const titles=[&#x27;Bình minh trên chiến tuyến&#x27;,&#x27;Bức thư từ phương Bắc&#x27;,&#x27;Cuộc gặp tại Berlin&#x27;,&#x27;Những lời chưa nói&#x27;,&#x27;Lệnh điều động&#x27;,&#x27;Trước giờ xuất phát&#x27;,&#x27;Người khách trong đêm&#x27;,&#x27;Con đường phía trước&#x27;];
let chapters=titles.map((t,i)=&gt;({id:219+i,title:t,status:[&#x27;done&#x27;,&#x27;done&#x27;,&#x27;running&#x27;,&#x27;pending&#x27;,&#x27;failed&#x27;,&#x27;stale&#x27;,&#x27;done&#x27;,&#x27;pending&#x27;][i],duration:[&#x27;18:42&#x27;,&#x27;21:08&#x27;,&#x27;—&#x27;,&#x27;—&#x27;,&#x27;—&#x27;,&#x27;19:35&#x27;,&#x27;17:24&#x27;,&#x27;—&#x27;][i],origin:i===1?&#x27;MP3 nhập trước&#x27;:&#x27;VieNeu · Thiện Minh&#x27;}));
const chapterSets=[chapters,chapters.map(c=&gt;({...c,id:c.id,title:c.title,status:c.status===&#x27;failed&#x27;?&#x27;pending&#x27;:c.status,origin:&#x27;Edge-TTS · Hoài My&#x27;}))];chapters=chapterSets[state.book]||chapterSets[0];
const statusText={done:&#x27;Có audio&#x27;,running:&#x27;Đang tạo&#x27;,pending:&#x27;Chưa có audio&#x27;,failed:&#x27;Tạo audio lỗi&#x27;,stale:&#x27;Cần cập nhật&#x27;};
const icon=n=&gt;`&lt;i data-lucide=&quot;${n}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const badge=s=&gt;`&lt;span class=&quot;nv-status nv-${s}&quot;&gt;${statusText[s]||s}&lt;/span&gt;`;
const btn=(label,action,primary=false)=&gt;`&lt;button data-action=&quot;${action}&quot; class=&quot;${primary?&#x27;nv-primary&#x27;:&#x27;&#x27;}&quot;&gt;${label}&lt;/button&gt;`;
const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:state.page,book:books[state.book].name,tab:state.tab,selectedChapters:[...state.selected],provider:state.provider},privateContent:{page:state.page,tab:state.tab,book:state.book}})?.catch(()=&gt;{});}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function navigate(page){state.page=page;state.toast=&#x27;&#x27;;state.selected.clear();render();persist();}
function heading(title,sub,actions=&#x27;&#x27;){return `&lt;div class=&quot;nv-heading&quot;&gt;&lt;div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p class=&quot;nv-sub&quot;&gt;${sub}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;nv-row&quot;&gt;${actions}&lt;/div&gt;&lt;/div&gt;`;}
function stats(){const b=books[state.book];return `&lt;div class=&quot;nv-stats&quot;&gt;${[[&#x27;Tổng số chương&#x27;,b.total],[&#x27;Có audio&#x27;,b.done],[&#x27;Chưa có audio&#x27;,b.other],[&#x27;Cần xử lý&#x27;,b.errors]].map(([l,n])=&gt;`&lt;div class=&quot;nv-stat&quot;&gt;&lt;span class=&quot;nv-sub&quot;&gt;${l}&lt;/span&gt;&lt;strong&gt;${n}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function story(){const b=books[state.book];return `&lt;div class=&quot;nv-crumb&quot;&gt;&lt;button class=&quot;nv-link&quot; data-page=&quot;library&quot;&gt;Thư viện truyện&lt;/button&gt; / &lt;span&gt;${b.name}&lt;/span&gt;&lt;/div&gt;${heading(b.name,b.desc,btn(icon(&#x27;upload&#x27;)+&#x27; Import&#x27;,&#x27;import&#x27;)+btn(icon(&#x27;plus&#x27;)+&#x27; Tạo tác vụ&#x27;,&#x27;newjob&#x27;,true))}&lt;div class=&quot;nv-row nv-sub&quot;&gt;&lt;span class=&quot;nv-pill&quot;&gt;${state.provider===&#x27;vieneu&#x27;?&#x27;VieNeu&#x27;:state.provider} · ${esc(state.voice)}&lt;/span&gt;&lt;span&gt;Cập nhật hôm nay, 14:32&lt;/span&gt;&lt;/div&gt;${stats()}&lt;div class=&quot;nv-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Bộ truyện&quot;&gt;${[[&#x27;chapters&#x27;,&#x27;Chương truyện&#x27;],[&#x27;bookjobs&#x27;,&#x27;Công việc&#x27;],[&#x27;booksettings&#x27;,&#x27;Cấu hình truyện&#x27;]].map(([id,l])=&gt;`&lt;button role=&quot;tab&quot; aria-selected=&quot;${state.tab===id}&quot; data-tab=&quot;${id}&quot;&gt;${l}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;${state.tab===&#x27;chapters&#x27;?chapterTable():state.tab===&#x27;bookjobs&#x27;?jobs():settings(true)}`;}
function chapterTable(){let rows=chapters.filter(c=&gt;(state.filter===&#x27;all&#x27;||c.status===state.filter)&amp;&amp;(`${c.id} ${c.title}`.toLowerCase().includes(state.query.toLowerCase())));return `${state.jobStatus===&#x27;running&#x27;&amp;&amp;state.book===0?`&lt;div class=&quot;nv-notice&quot;&gt;${icon(&#x27;audio-lines&#x27;)}&lt;div style=&quot;flex:1&quot;&gt;&lt;strong&gt;Đang tạo audio · Chương 221&lt;/strong&gt;&lt;div class=&quot;nv-sub&quot;&gt;7/11 đoạn hoàn thành · Tiến độ mô phỏng&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;nv-link&quot; data-page=&quot;jobs&quot;&gt;Xem tác vụ →&lt;/button&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;nv-panel&quot;&gt;&lt;div class=&quot;nv-toolbar&quot;&gt;&lt;input id=&quot;nv-search&quot; aria-label=&quot;Tìm chương&quot; placeholder=&quot;Tìm số chương, tiêu đề…&quot; value=&quot;${esc(state.query)}&quot;&gt;&lt;select id=&quot;nv-filter&quot; aria-label=&quot;Lọc trạng thái&quot;&gt;${[[&#x27;all&#x27;,&#x27;Tất cả trạng thái&#x27;],...Object.entries(statusText)].map(([v,l])=&gt;`&lt;option value=&quot;${v}&quot; ${state.filter===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${l}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/div&gt;${state.selected.size?`&lt;div class=&quot;nv-selectedbar&quot;&gt;&lt;span&gt;Đã chọn &lt;strong&gt;${state.selected.size}&lt;/strong&gt; chương&lt;/span&gt;&lt;div class=&quot;nv-row&quot;&gt;${btn(&#x27;Tạo audio&#x27;,&#x27;selectedtts&#x27;,true)}${btn(&#x27;Ghép audio&#x27;,&#x27;combine&#x27;)}${btn(&#x27;Bỏ chọn&#x27;,&#x27;clear&#x27;)}&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;nv-tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;input type=&quot;checkbox&quot; aria-label=&quot;Chọn tất cả chương đang hiển thị&quot; id=&quot;nv-all&quot; ${rows.length&amp;&amp;rows.every(c=&gt;state.selected.has(c.id))?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/th&gt;&lt;th&gt;Chương / Nội dung&lt;/th&gt;&lt;th&gt;Trạng thái audio&lt;/th&gt;&lt;th&gt;Thời lượng&lt;/th&gt;&lt;th&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows.map(c=&gt;`&lt;tr&gt;&lt;td&gt;&lt;input type=&quot;checkbox&quot; data-chapter=&quot;${c.id}&quot; aria-label=&quot;Chọn chương ${c.id}&quot; ${state.selected.has(c.id)?&#x27;checked&#x27;:&#x27;&#x27;}&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;nv-link nv-celltitle&quot; data-detail=&quot;${c.id}&quot;&gt;Chương ${c.id} · ${c.title}&lt;/button&gt;&lt;div class=&quot;nv-micro&quot;&gt;${c.origin===&#x27;MP3 nhập trước&#x27;?&#x27;Nhập từ audio cũ · Đã xác nhận&#x27;:&#x27;TXT tiếng Việt&#x27;}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${badge(c.status)}&lt;/td&gt;&lt;td style=&quot;font-variant-numeric:tabular-nums&quot;&gt;${c.duration}&lt;/td&gt;&lt;td&gt;${[&#x27;done&#x27;,&#x27;stale&#x27;].includes(c.status)?`&lt;button data-play=&quot;${c.id}&quot; aria-label=&quot;Nghe thử chương ${c.id}&quot;&gt;${icon(&#x27;play&#x27;)}&lt;/button&gt;`:`&lt;button class=&quot;nv-link&quot; data-detail=&quot;${c.id}&quot;&gt;${c.status===&#x27;failed&#x27;?&#x27;Xem lỗi&#x27;:&#x27;Chi tiết&#x27;}&lt;/button&gt;`}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)||&#x27;&lt;tr&gt;&lt;td colspan=&quot;5&quot; class=&quot;nv-empty&quot;&gt;Không có chương phù hợp. Thử thay đổi bộ lọc.&lt;/td&gt;&lt;/tr&gt;&#x27;}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;nv-tablefoot&quot;&gt;&lt;span&gt;${rows.length} chương mẫu / ${bTotal()} chương&lt;/span&gt;&lt;span&gt;Dữ liệu minh họa UI&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${chapters.some(c=&gt;[&#x27;done&#x27;,&#x27;stale&#x27;].includes(c.status))?player():&#x27;&#x27;}`;}
function bTotal(){return books[state.book].total;}
function player(){return `&lt;div class=&quot;nv-player&quot;&gt;&lt;button class=&quot;nv-play&quot; data-action=&quot;playtoggle&quot; aria-label=&quot;${state.playing?&#x27;Tạm dừng&#x27;:&#x27;Phát mô phỏng&#x27;}&quot;&gt;${icon(state.playing?&#x27;pause&#x27;:&#x27;play&#x27;)}&lt;/button&gt;&lt;div&gt;&lt;div class=&quot;nv-row&quot; style=&quot;justify-content:space-between&quot;&gt;&lt;span style=&quot;font-size:12px;font-weight:500&quot;&gt;Chương ${state.audioChapter||219} · ${titles[(state.audioChapter||219)-219]||titles[0]}&lt;/span&gt;&lt;span class=&quot;nv-micro&quot;&gt;Nghe thử mô phỏng&lt;/span&gt;&lt;/div&gt;&lt;input type=&quot;range&quot; id=&quot;nv-seek&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;${state.track}&quot; aria-label=&quot;Tua audio mô phỏng&quot;&gt;&lt;div class=&quot;nv-row nv-micro&quot; style=&quot;justify-content:space-between&quot;&gt;&lt;span&gt;${Math.floor(state.track*11.22/60).toString().padStart(2,&#x27;0&#x27;)}:${Math.floor(state.track*11.22%60).toString().padStart(2,&#x27;0&#x27;)}&lt;/span&gt;&lt;span&gt;18:42&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;nv-pill&quot;&gt;1×&lt;/span&gt;&lt;/div&gt;`;}
function library(){return heading(&#x27;Thư viện truyện&#x27;,&#x27;Nội dung, giọng đọc và tiến độ — trong một workspace.&#x27;,btn(icon(&#x27;plus&#x27;)+&#x27; Thêm truyện&#x27;,&#x27;addbook&#x27;,true))+`&lt;div class=&quot;nv-bookgrid&quot;&gt;${books.map((b,i)=&gt;`&lt;div class=&quot;nv-book&quot;&gt;&lt;div class=&quot;nv-row&quot; style=&quot;align-items:flex-start&quot;&gt;&lt;div class=&quot;nv-cover&quot;&gt;${icon(&#x27;book-open&#x27;)}&lt;/div&gt;&lt;div style=&quot;flex:1;min-width:0&quot;&gt;&lt;h2&gt;${esc(b.name)}&lt;/h2&gt;&lt;p class=&quot;nv-sub&quot;&gt;${b.desc}&lt;/p&gt;&lt;div class=&quot;nv-spacer&quot;&gt;&lt;/div&gt;&lt;span class=&quot;nv-pill&quot;&gt;${i?&#x27;Edge-TTS · Hoài My&#x27;:&#x27;VieNeu · Thiện Minh&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;nv-spacer&quot;&gt;&lt;/div&gt;&lt;div class=&quot;nv-row nv-sub&quot; style=&quot;justify-content:space-between&quot;&gt;&lt;span&gt;${b.done}/${b.total} chương có audio&lt;/span&gt;&lt;span&gt;${Math.round(b.done/b.total*100)}%&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;nv-track&quot;&gt;&lt;span style=&quot;width:${b.done/b.total*100}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;nv-row&quot; style=&quot;justify-content:space-between;margin-top:18px&quot;&gt;&lt;span class=&quot;nv-micro&quot;&gt;${b.errors?b.errors+&#x27; chương cần xử lý&#x27;:&#x27;Chưa có lỗi&#x27;}&lt;/span&gt;&lt;button data-book=&quot;${i}&quot;&gt;Mở truyện ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;}
function overview(){return heading(&#x27;Chào buổi chiều 👋&#x27;,&#x27;Tiếp tục câu chuyện của bạn.&#x27;,btn(&#x27;Mở thư viện&#x27;,&#x27;library&#x27;,true))+`&lt;div class=&quot;nv-stats&quot;&gt;${[[&#x27;Bộ truyện&#x27;,books.length],[&#x27;Chương đã nhập&#x27;,books.reduce((a,b)=&gt;a+b.total,0)],[&#x27;Chương có audio&#x27;,books.reduce((a,b)=&gt;a+b.done,0)],[&#x27;Job đang chạy&#x27;,state.jobStatus===&#x27;running&#x27;?1:0]].map(([l,n])=&gt;`&lt;div class=&quot;nv-stat&quot;&gt;&lt;span class=&quot;nv-sub&quot;&gt;${l}&lt;/span&gt;&lt;strong&gt;${n}&lt;/strong&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;h2 style=&quot;margin:25px 0 14px&quot;&gt;Công việc gần đây&lt;/h2&gt;${jobs()}&lt;h2 style=&quot;margin:25px 0 14px&quot;&gt;Tiếp tục làm việc&lt;/h2&gt;&lt;div class=&quot;nv-job nv-row&quot; style=&quot;justify-content:space-between&quot;&gt;&lt;div&gt;&lt;h3&gt;Đế chế sắt và máu&lt;/h3&gt;&lt;p class=&quot;nv-sub&quot;&gt;180/196 chương có audio · 7 chương cần xử lý&lt;/p&gt;&lt;/div&gt;${btn(&#x27;Mở bộ truyện →&#x27;,&#x27;story&#x27;)}&lt;/div&gt;`;}
